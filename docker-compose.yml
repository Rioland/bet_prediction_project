version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: football_ai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build:
      context: ./backend
    env_file:
      - ./backend/.env.example
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: ./backend
    command: celery -A app.workers.celery_app.celery worker --loglevel=info
    env_file:
      - ./backend/.env.example
    depends_on:
      - redis
      - postgres

  beat:
    build:
      context: ./backend
    command: celery -A app.workers.celery_app.celery beat --loglevel=info
    env_file:
      - ./backend/.env.example
    depends_on:
      - redis
      - postgres

volumes:
  pgdata:
