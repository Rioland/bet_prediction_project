name: CI

on:
  push:
  pull_request:

  jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic pydantic-settings sqlalchemy python-jose bcrypt pyotp cryptography slowapi pytest email-validator httpx itsdangerous celery redis joblib pandas scikit-learn
      - name: Run backend tests
        working-directory: backend
        run: PYTHONPATH=. pytest tests

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        run: cd mobile && npm install
      - name: Typecheck
        run: cd mobile && npm run typecheck
