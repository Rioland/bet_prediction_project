# Render Blueprint for the Football AI Predictor API.
#
# This file must stay at the repository root: Render's Blueprint flow only
# looks for render.yaml there. rootDir below is what points it at the API.
#
# Deploy: https://dashboard.render.com/blueprints -> New Blueprint Instance
#
# The frontend is deployed separately to Vercel; see DEPLOY.md.

services:
  - type: web
    name: predictor-api
    runtime: docker
    rootDir: artifacts/predictor-api
    dockerfilePath: Dockerfile
    healthCheckPath: /healthz
    plan: starter
    disk:
      # Trained models are written by scripts/train_model.py and read at request
      # time. Without a disk they vanish on every deploy and restart.
      name: models
      mountPath: /var/models
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: predictor-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: MODEL_DIR
        value: /var/models
      - key: ENVIRONMENT
        value: production
      # Your Vercel domain. Comma-separated for multiple origins.
      - key: CORS_ORIGINS
        sync: false
      # football-data.org key. Without it the API falls back to the keyless
      # ESPN source, which still works but covers fewer competitions.
      - key: FOOTBALL_API_KEY
        sync: false
      # Admin seeding is opt-in and has no default. Set both to create the
      # first admin; leave unset and no admin account is created at all.
      - key: DEFAULT_ADMIN_EMAIL
        sync: false
      - key: DEFAULT_ADMIN_PASSWORD
        sync: false
      # Public URLs. PUBLIC_API_URL is where OPay posts payment callbacks, so
      # it must be this service's own https address - OPay cannot reach
      # localhost, and a wrong value means paid subscriptions never activate.
      - key: PUBLIC_SITE_URL
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      # OPay. From the merchant dashboard under API Keys & Webhooks.
      # OPAY_SECRET_KEY signs callbacks and status queries; never expose it.
      - key: OPAY_MERCHANT_ID
        sync: false
      - key: OPAY_PUBLIC_KEY
        sync: false
      - key: OPAY_SECRET_KEY
        sync: false
      # Leave unset to stay on OPay staging. Setting this moves real money, so
      # only set it after a full sandbox payment has been tested end to end.
      - key: OPAY_PRODUCTION
        sync: false

databases:
  - name: predictor-db
    databaseName: predictor
    user: predictor
    plan: basic-256mb
