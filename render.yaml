# Render Blueprint: API, public website and admin site, all built with Docker.
#
# This file must stay at the repository root: Render's Blueprint flow only
# looks for render.yaml there.
#
# Deploy: https://dashboard.render.com/blueprints -> New Blueprint Instance
#
# Everything is on the free plan. What that means in practice:
#   - Services sleep after 15 minutes without traffic; the next visitor waits
#     about a minute while they wake. Upgrade `plan` to starter to avoid it.
#   - The filesystem is wiped on every restart. Trained models are therefore
#     also stored in the database and restored automatically.
#   - Free services cannot reach each other over the private network, so the
#     websites proxy to the API's public https address (API_UPSTREAM).
#   - A free Render Postgres database expires 30 days after creation. Before
#     then, upgrade it or point DATABASE_URL at another Postgres (e.g. Supabase).

services:
  - type: web
    name: predictor-api
    runtime: docker
    plan: free
    rootDir: artifacts/predictor-api
    dockerfilePath: Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: predictor-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
      # Only needed for browsers calling the API directly. The websites below
      # proxy /api through their own domain, so they do not need listing.
      - key: CORS_ORIGINS
        sync: false
      # football-data.org key. Without it the API falls back to the keyless
      # ESPN source, which still works but covers fewer competitions.
      - key: FOOTBALL_API_KEY
        sync: false
      # Admin seeding is opt-in and has no default. Set both to create the
      # first admin; leave unset and no admin account is created at all.
      - key: DEFAULT_ADMIN_EMAIL
        sync: false
      - key: DEFAULT_ADMIN_PASSWORD
        sync: false
      # Public URLs. PUBLIC_API_URL is where OPay posts payment callbacks, so
      # it must be this service's own https address - OPay cannot reach
      # localhost, and a wrong value means paid subscriptions never activate.
      - key: PUBLIC_SITE_URL
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      # OPay. From the merchant dashboard under API Keys & Webhooks.
      # OPAY_SECRET_KEY signs callbacks and status queries; never expose it.
      - key: OPAY_MERCHANT_ID
        sync: false
      - key: OPAY_PUBLIC_KEY
        sync: false
      - key: OPAY_SECRET_KEY
        sync: false
      # Leave unset to stay on OPay staging. Setting this moves real money, so
      # only set it after a full sandbox payment has been tested end to end.
      - key: OPAY_PRODUCTION
        sync: false

  # The websites are pnpm workspace packages, so they build from the repository
  # root (no rootDir) - a rootDir would hide the shared lib/ packages.
  - type: web
    name: predictor-web
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/web/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    buildFilter:
      paths:
        - artifacts/predictor-web/**
        - lib/**
        - deploy/web/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
    envVars:
      # Render passes env vars to docker build as build args: this picks the app.
      - key: APP
        value: predictor-web
      # The API's public address, e.g. https://predictor-api.onrender.com
      # Requests to /api/* on this site are forwarded there.
      - key: API_UPSTREAM
        sync: false

  - type: web
    name: predictor-admin
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/web/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    buildFilter:
      paths:
        - artifacts/admin-web/**
        - lib/**
        - deploy/web/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
    envVars:
      - key: APP
        value: admin-web
      - key: API_UPSTREAM
        sync: false

databases:
  - name: predictor-db
    databaseName: predictor
    user: predictor
    plan: free
